# Apply privacy patches onto a pinned upstream SHA in `.work/src`.
# On success: update lock + re-export patches on a control-repo branch and
# open a PR. Never wholesale-merges a product tree. Never auto-merges.
name: Upstream replay

on:
  workflow_dispatch:
    inputs:
      upstream_sha:
        description: "Exact upstream commit SHA (pinned)"
        required: true
        type: string
      upstream_version:
        description: "Expected product version (empty to skip check)"
        required: false
        default: ""
        type: string
      source_rev:
        description: "Expected SOURCE_REV (empty allowed)"
        required: false
        default: ""
        type: string

concurrency:
  group: upstream-replay-${{ inputs.upstream_sha }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: "1.94.0"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  replay-and-test:
    name: Replay and test
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    outputs:
      apply_rc: ${{ steps.apply.outputs.apply_rc }}
      conflict: ${{ steps.apply.outputs.conflict }}
      branding_required: ${{ steps.apply.outputs.branding_required }}
      contracts_ok: ${{ steps.contracts.outputs.ok }}
      sensitive_count: ${{ steps.sensitive.outputs.count }}
      version: ${{ steps.apply.outputs.version }}
      source_rev: ${{ steps.apply.outputs.source_rev }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - name: Checkout control tree
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config --global user.email "gork-ci@users.noreply.github.com"
          git config --global user.name "Gork CI"

      - name: Validate pinned SHA
        id: meta
        run: |
          set -euo pipefail
          SHA="${{ inputs.upstream_sha }}"
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "upstream_sha must be full 40-char hex" >&2
            exit 1
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Sensitive upstream diff
        id: sensitive
        run: |
          set -euo pipefail
          python3 maint/scripts/patchctl.py report --json \
            --new "${{ steps.meta.outputs.sha }}" \
            > upstream-sensitive.json
          python3 -c "import json; json.load(open('upstream-sensitive.json'))"
          COUNT=$(python3 -c "import json; print(json.load(open('upstream-sensitive.json'))['sensitive_count'])")
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
          echo "sensitive_count=${COUNT}"

      - name: Apply patch series into .work/src
        id: apply
        run: |
          set -euo pipefail
          EXTRA=()
          EXPECT_VER="${{ inputs.upstream_version }}"
          EXPECT_SR="${{ inputs.source_rev }}"
          if [[ -n "$EXPECT_VER" ]]; then EXTRA+=(--expect-version "$EXPECT_VER"); fi
          if [[ -n "$EXPECT_SR" ]]; then EXTRA+=(--expect-source-rev "$EXPECT_SR"); fi
          set +e
          python3 maint/scripts/patchctl.py apply \
            --upstream "${{ steps.meta.outputs.sha }}" \
            "${EXTRA[@]}"
          RC=$?
          set -e
          echo "apply_rc=${RC}" >> "$GITHUB_OUTPUT"
          VER=$(python3 -c "import json; print(json.load(open('maint/last-apply-status.json')).get('version',''))")
          SR=$(python3 -c "import json; print(json.load(open('maint/last-apply-status.json')).get('source_rev',''))")
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "source_rev=${SR}" >> "$GITHUB_OUTPUT"
          if [[ "$RC" -eq 3 ]]; then
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            echo "branding_required=false" >> "$GITHUB_OUTPUT"
          elif [[ "$RC" -eq 4 ]]; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            echo "branding_required=true" >> "$GITHUB_OUTPUT"
          elif [[ "$RC" -eq 0 ]]; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            echo "branding_required=false" >> "$GITHUB_OUTPUT"
          else
            exit "$RC"
          fi

      - name: Install system deps
        if: steps.apply.outputs.conflict != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler pkg-config libssl-dev cmake libclang-dev \
            build-essential

      - name: Install Rust toolchain
        if: steps.apply.outputs.conflict != 'true'
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo
        if: steps.apply.outputs.conflict != 'true'
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: ".work/src -> target"
          shared-key: upstream-replay
          cache-targets: "true"

      - name: Privacy contracts
        id: contracts
        if: steps.apply.outputs.conflict != 'true'
        env:
          GORK_WORK_SRC: ${{ github.workspace }}/.work/src
        run: |
          set -euo pipefail
          python3 maint/scripts/patchctl.py verify \
            --skip-expensive \
            --exclude-group supply-chain \
            --exclude-group egress \
            | tee privacy-contracts.log
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Finalize lock + re-export (only if contracts passed)
        if: steps.apply.outputs.conflict != 'true' && steps.contracts.outputs.ok == 'true'
        run: |
          set -euo pipefail
          python3 maint/scripts/patchctl.py finalize-sync \
            --upstream "${{ steps.meta.outputs.sha }}" \
            --version "${{ steps.apply.outputs.version }}" \
            --source-rev "${{ steps.apply.outputs.source_rev }}"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upstream-replay-${{ steps.apply.outputs.version || 'unknown' }}-${{ steps.meta.outputs.sha }}
          path: |
            upstream-sensitive.json
            privacy-contracts.log
            maint/last-apply-status.json
            maint/patches/
            maint/upstream.lock.toml
          if-no-files-found: ignore
          retention-days: 30

  publish-sync:
    name: Publish sync PR
    needs: replay-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout control tree
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Download replay artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: upstream-replay-${{ needs.replay-and-test.outputs.version || 'unknown' }}-${{ needs.replay-and-test.outputs.sha }}
          path: artifacts

      - name: Open conflict issue
        if: needs.replay-and-test.outputs.conflict == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          UPSTREAM_SHA: ${{ needs.replay-and-test.outputs.sha }}
          UPSTREAM_VERSION: ${{ needs.replay-and-test.outputs.version }}
          SOURCE_REV: ${{ needs.replay-and-test.outputs.source_rev }}
        with:
          script: |
            const fs = require('fs');
            const title = `sync conflict: upstream ${process.env.UPSTREAM_VERSION} (${process.env.UPSTREAM_SHA.slice(0, 7)})`;
            let sensitiveBody = '(missing)';
            try {
              sensitiveBody = fs.readFileSync('artifacts/upstream-sensitive.json', 'utf8').slice(0, 60000);
            } catch (_) {}
            const body = [
              '## Upstream patch replay conflict (fail-closed)',
              '',
              '| Field | Value |',
              '| --- | --- |',
              `| Upstream version | \`${process.env.UPSTREAM_VERSION}\` |`,
              `| Upstream commit | \`${process.env.UPSTREAM_SHA}\` |`,
              `| SOURCE_REV | \`${process.env.SOURCE_REV || '(empty)'}\` |`,
              '',
              'Critical patch conflict — no PR created. Fix the owning patch and re-run.',
              '',
              '```bash',
              `python3 maint/scripts/patchctl.py apply --upstream ${process.env.UPSTREAM_SHA}`,
              '```',
              '',
              '### Sensitive upstream diff',
              '',
              '```json',
              sensitiveBody,
              '```',
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'upstream-sync',
              per_page: 50,
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              core.info(`Issue already open: #${existing.number}`);
              return;
            }
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'upstream-sync',
                color: 'FBCA04',
              });
            } catch (_) {}
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['upstream-sync', 'security-review-required'],
            });

      - name: Open control-plane sync PR
        if: needs.replay-and-test.outputs.conflict != 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          UPSTREAM_SHA: ${{ needs.replay-and-test.outputs.sha }}
          UPSTREAM_VERSION: ${{ needs.replay-and-test.outputs.version }}
          SOURCE_REV: ${{ needs.replay-and-test.outputs.source_rev }}
          CONTRACTS_OK: ${{ needs.replay-and-test.outputs.contracts_ok }}
          BRANDING: ${{ needs.replay-and-test.outputs.branding_required }}
          SENSITIVE: ${{ needs.replay-and-test.outputs.sensitive_count }}
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            const sha = process.env.UPSTREAM_SHA;
            const ver = process.env.UPSTREAM_VERSION || 'unknown';
            const contractsOk = process.env.CONTRACTS_OK === 'true';
            const branding = process.env.BRANDING === 'true';
            const sensitive = Number(process.env.SENSITIVE || '0');
            if (!contractsOk) {
              core.setFailed('Privacy contracts did not pass — not opening a sync PR.');
              return;
            }
            const branch = `sync/lock-${ver}-${sha.slice(0, 7)}`;
            execSync('git config user.name gork-ci');
            execSync('git config user.email gork-ci@users.noreply.github.com');
            execSync(`git checkout -B ${branch}`);
            // Restore finalized lock + patches from the replay artifact.
            const copies = [
              ['artifacts/maint/upstream.lock.toml', 'maint/upstream.lock.toml'],
              ['artifacts/upstream.lock.toml', 'maint/upstream.lock.toml'],
              ['artifacts/maint/last-apply-status.json', 'maint/last-apply-status.json'],
              ['artifacts/last-apply-status.json', 'maint/last-apply-status.json'],
            ];
            for (const [src, dest] of copies) {
              if (fs.existsSync(src)) fs.copyFileSync(src, dest);
            }
            const patchSrc = fs.existsSync('artifacts/maint/patches')
              ? 'artifacts/maint/patches'
              : (fs.existsSync('artifacts/patches') ? 'artifacts/patches' : '');
            if (patchSrc) {
              execSync(`rm -rf maint/patches && mkdir -p maint/patches && cp -a ${patchSrc}/. maint/patches/`);
            }
            execSync('git add maint/upstream.lock.toml maint/patches maint/last-apply-status.json');
            try {
              execSync(`git commit -m "sync: upstream ${ver} (${sha.slice(0, 7)})"`);
            } catch (e) {
              core.info('nothing to commit (lock already current)');
            }
            execSync(`git push -u origin ${branch} --force`);

            const labels = ['upstream-sync'];
            if (branding) labels.push('branding-required');
            if (sensitive > 0) labels.push('security-review-required');
            let sensitiveBody = '(missing)';
            try {
              sensitiveBody = fs.readFileSync('artifacts/upstream-sensitive.json', 'utf8').slice(0, 60000);
            } catch (_) {}
            const body = [
              '## Upstream sync (control plane only)',
              '',
              'This PR updates `maint/upstream.lock.toml` and the patch series.',
              'It does **not** vendor the upstream tree. Auto-merge is disabled;',
              'a human must review, especially if sensitive paths changed.',
              '',
              '| Field | Value |',
              '| --- | --- |',
              `| Upstream version | \`${ver}\` |`,
              `| Upstream commit | \`${sha}\` |`,
              `| SOURCE_REV | \`${process.env.SOURCE_REV || '(empty)'}\` |`,
              `| Privacy contracts | passed (--skip-expensive) |`,
              `| Branding skipped | ${branding ? 'yes' : 'no'} |`,
              `| Sensitive paths | ${sensitive} |`,
              '',
              '### Sensitive upstream diff',
              '',
              '```json',
              sensitiveBody,
              '```',
            ].join('\n');
            for (const name of labels) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                  color: name === 'security-review-required' ? 'B60205' : 'FBCA04',
                });
              } catch (_) {}
            }
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              state: 'open',
            });
            if (prs.length) {
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prs[0].number,
                body,
              });
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prs[0].number,
                labels,
              });
            } else {
              const { data: pr } = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `sync: upstream ${ver} (${sha.slice(0, 7)})`,
                head: branch,
                base: 'main',
                draft: true,
                body,
              });
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels,
              });
            }
