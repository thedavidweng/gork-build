# Fail closed if the privacy patch series no longer applies on the locked SHA.
name: Patch roundtrip

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: patch-roundtrip-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-roundtrip:
    name: Lint + apply-only roundtrip
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config --global user.email "gork-ci@users.noreply.github.com"
          git config --global user.name "Gork CI"

      - name: Cache upstream clone
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .work/upstream
          key: upstream-${{ hashFiles('maint/upstream.lock.toml') }}

      - name: patchctl lint (static + apply-only)
        run: python3 maint/scripts/patchctl.py lint
