# Gork privacy CI — control repo + materialized product tree.
# Single source of truth for privacy contracts: maint/contracts/privacy-contract.toml
name: Gork privacy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gork-privacy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  RUST_TOOLCHAIN: "1.94.0"

jobs:
  patch-lint:
    name: Patch queue lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config --global user.email "gork-ci@users.noreply.github.com"
          git config --global user.name "Gork CI"

      - name: patchctl lint
        run: python3 maint/scripts/patchctl.py lint

  privacy-contracts:
    name: Privacy contracts
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config --global user.email "gork-ci@users.noreply.github.com"
          git config --global user.name "Gork CI"

      - name: Cache upstream clone
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .work/upstream
          key: upstream-${{ hashFiles('maint/upstream.lock.toml') }}

      - name: Materialize product tree
        run: python3 maint/scripts/patchctl.py checkout

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler pkg-config libssl-dev cmake libclang-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: ".work/src -> target"
          shared-key: privacy-tests
          cache-targets: "true"

      - name: Privacy contracts (no supply-chain / no egress)
        env:
          GORK_WORK_SRC: ${{ github.workspace }}/.work/src
        run: |
          python3 maint/scripts/patchctl.py verify \
            --skip-expensive \
            --exclude-group supply-chain \
            --exclude-group egress

  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Configure git identity
        run: |
          git config --global user.email "gork-ci@users.noreply.github.com"
          git config --global user.name "Gork CI"
      - name: Cache upstream clone
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .work/upstream
          key: upstream-${{ hashFiles('maint/upstream.lock.toml') }}
      - name: Materialize product tree
        run: python3 maint/scripts/patchctl.py checkout
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit (via contract)
        env:
          GORK_WORK_SRC: ${{ github.workspace }}/.work/src
        run: python3 maint/scripts/patchctl.py verify --only cargo-audit

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Configure git identity
        run: |
          git config --global user.email "gork-ci@users.noreply.github.com"
          git config --global user.name "Gork CI"
      - name: Cache upstream clone
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .work/upstream
          key: upstream-${{ hashFiles('maint/upstream.lock.toml') }}
      - name: Materialize product tree
        run: python3 maint/scripts/patchctl.py checkout
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler pkg-config libssl-dev cmake libclang-dev \
            build-essential
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: ".work/src -> target"
          shared-key: clippy
          cache-targets: "true"
      - name: Clippy privacy-critical crates
        working-directory: .work/src
        run: |
          cargo clippy --no-deps \
            -p xai-grok-version \
            -p xai-mixpanel \
            -p xai-grok-telemetry \
            -p xai-grok-update \
            --lib \
            -- -D warnings
      - name: Clippy gork binary crate
        working-directory: .work/src
        run: |
          cargo clippy --no-deps \
            -p xai-grok-pager-bin \
            --bins \
            -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Configure git identity
        run: |
          git config --global user.email "gork-ci@users.noreply.github.com"
          git config --global user.name "Gork CI"
      - name: Cache upstream clone
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .work/upstream
          key: upstream-${{ hashFiles('maint/upstream.lock.toml') }}
      - name: Materialize product tree
        run: python3 maint/scripts/patchctl.py checkout
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - name: cargo fmt --check
        working-directory: .work/src
        run: cargo fmt --all -- --check

  build-gork:
    name: Build gork
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Configure git identity
        run: |
          git config --global user.email "gork-ci@users.noreply.github.com"
          git config --global user.name "Gork CI"
      - name: Cache upstream clone
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .work/upstream
          key: upstream-${{ hashFiles('maint/upstream.lock.toml') }}
      - name: Materialize product tree
        run: python3 maint/scripts/patchctl.py checkout
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler pkg-config libssl-dev cmake libclang-dev \
            build-essential
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: ".work/src -> target"
          shared-key: build-gork
          cache-targets: "true"
      - name: Build gork (release)
        working-directory: .work/src
        run: cargo build -p xai-grok-pager-bin --release
      - name: Smoke gork CLI
        run: |
          set -euo pipefail
          BIN=.work/src/target/release/gork
          test -x "$BIN"
          "$BIN" --version
          HELP=$("$BIN" --help)
          echo "$HELP" | head -20
          echo "$HELP" | grep -q 'Gork Build TUI'
          echo "$HELP" | grep -q 'Usage: gork'
          echo "smoke ok"

      - name: Package linux-x64 like a GitHub Release
        run: |
          set -euo pipefail
          VER=$(sed -n 's/^version = "\(.*\)"/\1/p' maint/upstream.lock.toml | head -1)
          ASSET=$(bash maint/scripts/package_gork.sh \
            --bin .work/src/target/release/gork \
            --platform linux-x64 \
            --tag "v${VER}-gork.ci" \
            --output-dir "$RUNNER_TEMP")
          bash maint/scripts/smoke_release_archive.sh "$ASSET" \
            --platform linux-x64 \
            --expect-version "$VER"
          echo "release-archive-smoke ok: $ASSET"
