# Security minimum-version floors for the upstream-inherited Cargo.lock.
#
# Applied during every sync by maint/scripts/apply_security_floors.py
# (lock-policy post_apply hook): a floor bumps the locked package to exactly
# `precise` ONLY when the locked version is lower. Once upstream's lockfile
# reaches the floor the entry is a no-op — we never downgrade and never move
# ahead of a floor, so drift from upstream stays bounded to known RustSec
# fixes. Remove entries once upstream has caught up.
#
# Gate: the `cargo audit` required check (maint/contracts/privacy-contract.toml).
schema = 1

[[floor]]
package = "crossbeam-epoch"
precise = "0.9.20"
advisory = "RUSTSEC-2026-0204"

# quinn-proto 0.11.18 requires rand >=0.10.1. Select only this series;
# the inherited workspace also contains rand 0.8 and must retain that API.
[[floor]]
package = "rand"
series = "0.10"
precise = "0.10.1"
advisory = "RUSTSEC-2026-0097"

[[floor]]
package = "quinn-proto"
precise = "0.11.18"
advisory = "RUSTSEC-2026-0338, RUSTSEC-2026-0339, RUSTSEC-2026-0340, RUSTSEC-2026-0341, RUSTSEC-2026-0342"

[[floor]]
package = "webbrowser"
precise = "1.2.2"
advisory = "RUSTSEC-2026-0257"

[[floor]]
package = "rustls"
precise = "0.23.46"
advisory = "RUSTSEC-2026-0346, RUSTSEC-2026-0347, RUSTSEC-2026-0348, RUSTSEC-2026-0349"

# pdf_oxide permits this compatible office_oxide release, whose ZIP parser
# moves from vulnerable zip 8 to zip 9. Direct users require zip 9 in 0072.
[[floor]]
package = "office_oxide"
precise = "0.1.15"
advisory = "RUSTSEC-2026-0367, RUSTSEC-2026-0368, RUSTSEC-2026-0369"
