# Cargo.lock strategy for upstream replay.
schema = 1

# inherit-upstream: keep upstream Cargo.lock; do not commit fork-only lock churn
# into the functional patch series.
mode = "inherit-upstream"

# Run after successful apply (before contracts). Fail-closed if any command fails.
post_apply_commands = [
  # Validate lockfile is coherent with the tree (does not rewrite it).
  ["cargo", "metadata", "--format-version", "1", "--no-deps"],
]

# Optional: pin security bumps that Grok Privacy must carry (uncomment and set precise versions).
# cargo_update_pins = [
#   ["cargo", "update", "-p", "quinn-proto", "--precise", "X.Y.Z"],
# ]
#
# RUSTSEC-2026-0258 : h2 0.4.15 vulnérable (DoS « unbounded empty DATA frames »),
# correctif 0.4.16 — bump patch-level compatible semver, hors advisory ignorée.
# À retirer quand le lock amont embarquera h2 >= 0.4.16.
cargo_update_pins = [
  ["cargo", "update", "-p", "h2", "--precise", "0.4.16"],
]
